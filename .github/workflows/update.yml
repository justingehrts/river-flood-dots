name: Update river flood dots

on:
  schedule:
    - cron: "7,37 * * * *"   # twice an hour; GitHub may delay scheduled runs
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build KMZ/KML
        run: python scripts/build_river_dots.py
      - name: Commit changes
        run: |
          git config user.name "river-flood-dots bot"
          git config user.email "actions@users.noreply.github.com"
          git add output/observed_rivers.kmz output/status.json
          git diff --cached --quiet || git commit -m "Update river dots $(date -u +'%Y-%m-%d %H:%MZ')"
          git push
      # Publish the KMZ and status.json at https://<user>.github.io/river-flood-dots/ . Only reached if the build above succeeded,
      # so a failed run never replaces the last good site.
      - name: Stage site
        run: |
          mkdir site
          cp output/observed_rivers.kmz output/status.json site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4
